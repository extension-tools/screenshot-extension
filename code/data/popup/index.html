<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenshot Extension</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <button id="capture-pdf" type="button" data-export-format="pdf">
    <img src="../icons/32.png" alt="" width="32" height="32">
    <span>Download as PDF</span>
  </button>
  <button id="capture-png" type="button" data-export-format="png">
    <img src="../icons/32.png" alt="" width="32" height="32">
    <span>Capture entire page</span>
  </button>
  <script src="index.js"></script>
</body>
</html>
