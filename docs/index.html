<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screenshot Extension installed! 🎉 Here's how to get started.</title>
    <link rel="shortcut icon" type="image/png" href="assets/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="128x128" href="assets/favicon.png?v=2" />
    <style>
      :root {
        --page-bg: #ffffff;
        --ink: #032048;
        --muted: #5a6d8f;
        --image-shadow: 0 20px 60px rgba(15, 23, 42, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--page-bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page {
        width: min(100%, 1230px);
        margin: 0 auto;
        padding: 54px 24px 72px;
      }

      .intro {
        max-width: 360px;
        margin: 0 auto 28px;
        text-align: center;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(34px, 4.4vw, 56px);
        font-weight: 750;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .headline-main,
      .headline-sub {
        display: block;
      }

      .headline-sub {
        margin-top: 10px;
        color: var(--muted);
        font-size: clamp(24px, 3vw, 38px);
        font-weight: 650;
        line-height: 1.14;
      }

      .step {
        max-width: 360px;
        margin: 0 auto 22px;
        color: var(--muted);
        font-size: clamp(18px, 2vw, 22px);
        font-weight: 500;
        line-height: 1.45;
        text-align: center;
      }

      .shot {
        display: block;
        width: min(100%, 360px);
        height: auto;
        margin: 0 auto 52px;
        border-radius: 18px;
        box-shadow: var(--image-shadow);
      }

      .shot:last-child {
        margin-bottom: 0;
      }

      @media (min-width: 768px) {
        .intro {
          max-width: 760px;
        }

        .step {
          max-width: 820px;
        }

        .shot {
          width: min(75.85vw, 910px);
        }
      }

      @media (max-width: 720px) {
        .page {
          padding: 34px 15px 48px;
        }

        .intro {
          margin-bottom: 20px;
        }

        .step {
          margin-bottom: 18px;
          text-align: left;
        }

        .shot {
          margin-bottom: 38px;
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="intro" aria-labelledby="welcome-title">
        <h1 id="welcome-title">
          <span class="headline-main">Screenshot Extension installed! 🎉</span>
          <span class="headline-sub">Here's how to get started.</span>
        </h1>
      </section>

      <p class="step">
        Click the puzzle piece (1) in the top right of your browser. Then, click the little pin (2) next to the extension:
      </p>
      <img
        class="shot"
        src="assets/pin-extension.png"
        alt="Pin Screenshot Extension in the Chrome extensions menu"
        width="2600"
        height="1670"
      />

      <p class="step">
        That's it! Click the icon (3) on any page to use it.
      </p>
      <img
        class="shot"
        src="assets/open-extension.png"
        alt="Open Screenshot Extension from the browser toolbar"
        width="2600"
        height="1670"
      />
    </main>
  </body>
</html>
