<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Take full page screenshots as a PNG or PDF</title>
    <style>
      :root {
        --page-bg: #ffffff;
        --ink: #1f2933;
        --muted: #5f6b7a;
        --image-shadow: 0 20px 60px rgba(15, 23, 42, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--page-bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page {
        width: min(100%, 1230px);
        margin: 0 auto;
        padding: 54px 24px 72px;
      }

      .intro {
        max-width: 360px;
        margin: 0 auto 28px;
        text-align: center;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(34px, 5vw, 58px);
        font-weight: 760;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .step {
        max-width: 360px;
        margin: 0 auto 22px;
        color: var(--muted);
        font-size: clamp(18px, 2.2vw, 24px);
        font-weight: 500;
        line-height: 1.48;
        text-align: center;
      }

      .shot {
        display: block;
        width: min(100%, 360px);
        height: auto;
        margin: 0 auto 52px;
        border-radius: 18px;
        box-shadow: var(--image-shadow);
      }

      .shot:last-child {
        margin-bottom: 0;
      }

      @media (min-width: 768px) {
        .intro {
          max-width: 760px;
        }

        .step {
          max-width: 820px;
        }

        .shot {
          width: min(75.85vw, 910px);
        }
      }

      @media (max-width: 720px) {
        .page {
          padding: 34px 15px 48px;
        }

        .intro {
          margin-bottom: 20px;
        }

        .step {
          margin-bottom: 18px;
          text-align: left;
        }

        .shot {
          margin-bottom: 38px;
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="intro" aria-labelledby="welcome-title">
        <h1 id="welcome-title">Take full page screenshots as a PNG or PDF</h1>
      </section>

      <p class="step">
        Click the puzzle piece (1) in the top right of your browser. Then, click the little pin (2) next to the extension:
      </p>
      <img
        class="shot"
        src="assets/pin-extension.png"
        alt="Pin Screenshot Extension in the Chrome extensions menu"
        width="2600"
        height="1670"
      />

      <p class="step">
        Open the extension (3) on any page to start using Screenshot Extension
      </p>
      <img
        class="shot"
        src="assets/open-extension.png"
        alt="Open Screenshot Extension from the browser toolbar"
        width="2600"
        height="1670"
      />
    </main>
  </body>
</html>
