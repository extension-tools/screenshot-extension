<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screenshot Extension 설치가 끝났어요! 🎉 이렇게 시작해 보세요.</title>
    <link rel="shortcut icon" type="image/png" href="../assets/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="128x128" href="../assets/favicon.png?v=2" />
    <style>
      :root {
        --page-bg: #ffffff;
        --ink: #032048;
        --muted: #5a6d8f;
        --muted-strong: #435a7a;
        --image-shadow: 0 20px 60px rgba(15, 23, 42, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--page-bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }

      .page {
        width: min(100%, 1230px);
        margin: 0 auto;
        padding: 54px 24px 72px;
      }

      .intro {
        max-width: 360px;
        margin: 0 auto 28px;
        text-align: center;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(31px, 3.7vw, 46px);
        font-weight: 800;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .headline-main,
      .headline-sub {
        display: block;
      }

      .headline-keep {
        white-space: nowrap;
      }

      .headline-sub {
        margin-top: 8px;
        color: var(--muted-strong);
        font-size: clamp(23px, 2.7vw, 34px);
        font-weight: 750;
        line-height: 1.14;
      }

      .step {
        max-width: 360px;
        margin: 0 auto 22px;
        color: var(--ink);
        font-size: clamp(18px, 2vw, 22px);
        font-weight: 500;
        line-height: 1.45;
        text-align: center;
      }

      .shot {
        display: block;
        width: min(100%, 360px);
        height: auto;
        margin: 0 auto 52px;
        border-radius: 18px;
        box-shadow: var(--image-shadow);
      }

      .shot:last-child {
        margin-bottom: 0;
      }

      .shot--crop-bottom {
        height: min(calc((100vw - 30px) * 0.51), 184px);
        object-fit: cover;
        object-position: top center;
      }

      @media (min-width: 768px) {
        .intro {
          max-width: 760px;
        }

        .step {
          max-width: 820px;
        }

        .shot {
          width: min(75.85vw, 910px);
        }

        .shot--crop-bottom {
          height: min(38.7vw, 464px);
          margin-bottom: 44px;
        }
      }

      @media (max-width: 720px) {
        .page {
          padding: 34px 15px 48px;
        }

        .intro {
          margin-bottom: 20px;
        }

        .step {
          margin-bottom: 18px;
          text-align: left;
        }

        .shot {
          margin-bottom: 38px;
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="intro" aria-labelledby="welcome-title">
        <h1 id="welcome-title">
          <span class="headline-main">Screenshot Extension <span class="headline-keep">설치가 끝났어요! 🎉</span></span>
          <span class="headline-sub">이렇게 시작해 보세요.</span>
        </h1>
      </section>

      <p class="step">
        브라우저 오른쪽 위에 있는 퍼즐 모양 아이콘(1)을 클릭하세요. 그런 다음, 확장 프로그램 옆에 있는 고정 핀(2)을 클릭하세요:
      </p>
      <img
        class="shot shot--crop-bottom"
        src="../assets/pin-extension.png"
        alt="Pin Screenshot Extension in the Chrome extensions menu"
        width="2600"
        height="1670"
      />

      <p class="step">
        이게 전부예요! 이제 어느 페이지에서든 아이콘(3)을 클릭하면 바로 사용할 수 있어요.
      </p>
      <img
        class="shot shot--crop-bottom"
        src="../assets/open-extension.png"
        alt="Open Screenshot Extension from the browser toolbar"
        width="2600"
        height="1670"
      />
    </main>
  </body>
</html>
