<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenshot Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" role="dialog" aria-label="Capture options">
    <div class="top-row">
      <img class="mascot" src="./assets/mascot-popup@2x.png" alt="" aria-hidden="true">
      <div class="chip">Full page</div>
    </div>

    <div class="actions">
      <button id="capture-pdf" class="action-row" type="button" data-export-format="pdf">
        <svg class="file-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M8 3.5h10.5L25.5 10v16.5A2.5 2.5 0 0 1 23 29H8A2.5 2.5 0 0 1 5.5 26.5V6A2.5 2.5 0 0 1 8 3.5Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M18.5 3.5V9A1 1 0 0 0 19.5 10H25.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.8 19.4h12.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M9.8 23.6h9.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M9.8 15.2h7.3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span class="label">Capture as PDF</span>
        <svg class="chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M7 4.5L12.5 10L7 15.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button id="capture-png" class="action-row" type="button" data-export-format="png">
        <svg class="file-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M8 3.5h10.5L25.5 10v16.5A2.5 2.5 0 0 1 23 29H8A2.5 2.5 0 0 1 5.5 26.5V6A2.5 2.5 0 0 1 8 3.5Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M18.5 3.5V9A1 1 0 0 0 19.5 10H25.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.8 15.2h11.7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M9.8 19.4h11.7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M9.8 23.6h6.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span class="label">Capture as PNG</span>
        <svg class="chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M7 4.5L12.5 10L7 15.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </main>
</body>
</html>
