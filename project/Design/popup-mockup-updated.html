<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1468, initial-scale=1">
  <title>Screenshot Extension Popup Mockup</title>
  <style>
    :root {
      --bg-top: #f5f8fd;
      --bg-bottom: #e9eef8;
      --surface: #ffffff;
      --surface-soft: #edf4ff;
      --chip-fill: #eaf3ff;

      --brand-blue: #0372f9;
      --ink: #032048;
      --border: #d7e6ff;
      --border-hover: #8fc0ff;

      --popup-shadow: 0 28px 70px rgba(3, 32, 72, 0.14);
      --row-shadow: 0 10px 22px rgba(3, 32, 72, 0.06);

      --radius-popup: 34px;
      --radius-row: 28px;
      --radius-pill: 999px;

      --font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      --button-label-size: 52px;
      --button-label-weight: 500;
      --button-label-line-height: 105%;

      --chip-label-size: 30px;
      --chip-label-weight: 500;
      --chip-label-line-height: 30px;

      --popup-width: 1190px;
      --popup-height: 684px;
      --popup-padding-top: 80px;
      --popup-padding-right: 88px;
      --popup-padding-bottom: 64px;
      --popup-padding-left: 88px;

      --top-row-gap: 30px;
      --top-row-to-actions-gap: 40px;

      --mascot-width: 148px;
      --mascot-height: 106px;

      --chip-width: 250px;
      --chip-height: 78px;
      --chip-padding-x: 40px;
      --chip-radius: 999px;

      --actions-gap: 26px;
      --action-row-width: 994px;
      --action-row-height: 184px;
      --action-row-radius: 28px;
      --action-row-padding-x: 54px;

      --file-icon-size: 128px;
      --icon-text-gap: 48px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1468px;
      min-width: 1468px;
      background: #111827;
      color: var(--ink);
      font-family: var(--font-family);
    }

    .canvas {
      position: relative;
      width: 1468px;
      height: 1168px;
      padding: 32px;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.90), transparent 35%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    }

    .popup {
      position: absolute;
      left: 140px;
      top: 128px;
      width: var(--popup-width);
      height: var(--popup-height);
      padding:
        var(--popup-padding-top)
        var(--popup-padding-right)
        var(--popup-padding-bottom)
        var(--popup-padding-left);
      border-radius: var(--radius-popup);
      background: var(--surface);
      box-shadow: var(--popup-shadow);
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: var(--top-row-gap);
      margin-bottom: var(--top-row-to-actions-gap);
    }

    .mascot {
      width: var(--mascot-width);
      height: var(--mascot-height);
      flex: 0 0 var(--mascot-width);
      object-fit: contain;
      display: block;
    }

    .chip {
      width: var(--chip-width);
      height: var(--chip-height);
      padding: 0 var(--chip-padding-x);
      border-radius: var(--chip-radius);
      background: var(--chip-fill);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: var(--chip-label-size);
      font-weight: var(--chip-label-weight);
      line-height: var(--chip-label-line-height);
      letter-spacing: -0.03em;
      white-space: nowrap;
    }

    .actions {
      width: var(--action-row-width);
      display: flex;
      flex-direction: column;
      gap: var(--actions-gap);
    }

    .action-row {
      width: var(--action-row-width);
      height: var(--action-row-height);
      padding: 0 var(--action-row-padding-x);
      border: 3px solid var(--border);
      border-radius: var(--action-row-radius);
      background: var(--surface);
      box-shadow: var(--row-shadow);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--icon-text-gap);
      appearance: none;
      cursor: default;
      font: inherit;
      text-align: left;
    }

    .file-icon {
      width: var(--file-icon-size);
      height: var(--file-icon-size);
      flex: 0 0 var(--file-icon-size);
      color: var(--brand-blue);
      display: block;
    }

    .label {
      flex: 0 0 auto;
      color: var(--ink);
      font-size: var(--button-label-size);
      font-weight: var(--button-label-weight);
      line-height: var(--button-label-line-height);
      letter-spacing: -0.04em;
      white-space: nowrap;
    }

  </style>
</head>
<body>
  <div class="canvas">
    <div class="popup">
      <div class="top-row">
        <img class="mascot" src="./assets/mascot-waving-trimmed.png" alt="">
        <div class="chip">Full page</div>
      </div>

      <div class="actions">
        <button class="action-row" type="button">
          <svg class="file-icon pdf" viewBox="0 0 128 128" fill="none" aria-hidden="true">
            <path d="M37 14H76.5L101 38.5V114H37V14Z"
              stroke="currentColor" stroke-width="5.5" stroke-linejoin="round"></path>
            <path d="M76.5 14V37C76.5 38.7 77.8 40 79.5 40H101"
              stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path>
            <text x="64" y="76" text-anchor="middle" dominant-baseline="middle"
              fill="currentColor" font-size="28" font-weight="700"
              font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">PDF</text>
          </svg>

          <span class="label">Capture as PDF</span>

        </button>

        <button class="action-row" type="button">
          <svg class="file-icon png" viewBox="0 0 128 128" fill="none" aria-hidden="true">
            <path d="M37 14H76.5L101 38.5V114H37V14Z"
              stroke="currentColor" stroke-width="5.5" stroke-linejoin="round"></path>
            <path d="M76.5 14V37C76.5 38.7 77.8 40 79.5 40H101"
              stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path>
            <text x="64" y="76" text-anchor="middle" dominant-baseline="middle"
              fill="currentColor" font-size="26" font-weight="700"
              font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">PNG</text>
          </svg>

          <span class="label">Capture as PNG</span>

        </button>
      </div>
    </div>
  </div>
</body>
</html>
