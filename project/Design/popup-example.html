<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Popup Mockup</title>
  <style>
    :root {
      --bg: #eef3fb;
      --surface: #ffffff;
      --surface-soft: #edf4ff;
      --brand-blue: #0372f9;
      --brand-blue-soft: #eaf3ff;
      --ink: #032048;
      --border: #d7e6ff;
      --border-hover: #8fc0ff;
      --shadow: 0 28px 70px rgba(3, 32, 72, 0.14);
      --shadow-row: 0 10px 22px rgba(3, 32, 72, 0.06);
      --radius-popup: 34px;
      --radius-row: 28px;
      --radius-pill: 999px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.9), transparent 35%),
        linear-gradient(180deg, #f5f8fd 0%, #e9eef8 100%);
      font-family: var(--font);
      color: var(--ink);
    }

    .popup {
      width: min(1260px, calc(100vw - 64px));
      background: var(--surface);
      border-radius: var(--radius-popup);
      box-shadow: var(--shadow);
      padding: 92px 98px 74px;
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 38px;
      margin-bottom: 48px;
    }

    .mascot {
      width: 184px;
      height: 132px;
      object-fit: contain;
      display: block;
      flex: 0 0 auto;
    }

    .chip {
      min-width: 288px;
      height: 92px;
      padding: 0 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-pill);
      background: var(--brand-blue-soft);
      color: var(--ink);
      font-size: 38px;
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .action-row {
      width: 100%;
      min-height: 246px;
      display: flex;
      align-items: center;
      gap: 58px;
      padding: 0 62px;
      border: 3px solid var(--border);
      border-radius: var(--radius-row);
      background: var(--surface);
      box-shadow: var(--shadow-row);
      appearance: none;
      cursor: pointer;
      text-align: left;
      transition:
        background-color 160ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease,
        transform 160ms ease;
    }

    .action-row:hover {
      background: #f8fbff;
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(3, 32, 72, 0.08);
    }

    .action-row:active {
      transform: translateY(0);
      background: var(--surface-soft);
    }

    .action-row:focus-visible {
      outline: 4px solid rgba(3, 114, 249, 0.24);
      outline-offset: 4px;
    }

    .file-icon {
      width: 148px;
      height: 148px;
      flex: 0 0 148px;
      color: var(--brand-blue);
      display: block;
    }

    .label {
      flex: 1 1 auto;
      min-width: 0;
      color: var(--ink);
      font-size: 64px;
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .chevron {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      color: var(--ink);
    }

    @media (max-width: 1100px) {
      .popup {
        padding: 54px 44px 40px;
      }

      .top-row {
        gap: 20px;
        margin-bottom: 28px;
      }

      .mascot {
        width: 112px;
        height: 80px;
      }

      .chip {
        min-width: 180px;
        height: 62px;
        padding: 0 28px;
        font-size: 26px;
      }

      .action-row {
        min-height: 150px;
        gap: 28px;
        padding: 0 28px;
      }

      .file-icon {
        width: 88px;
        height: 88px;
        flex-basis: 88px;
      }

      .label {
        font-size: 38px;
      }

      .chevron {
        width: 34px;
        height: 34px;
        flex-basis: 34px;
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 16px;
      }

      .popup {
        width: 100%;
        padding: 28px 20px 20px;
        border-radius: 24px;
      }

      .top-row {
        gap: 12px;
        margin-bottom: 16px;
      }

      .mascot {
        width: 74px;
        height: 54px;
      }

      .chip {
        min-width: 132px;
        height: 46px;
        padding: 0 20px;
        font-size: 20px;
      }

      .actions {
        gap: 14px;
      }

      .action-row {
        min-height: 96px;
        padding: 0 18px;
        gap: 18px;
        border-radius: 20px;
      }

      .file-icon {
        width: 56px;
        height: 56px;
        flex-basis: 56px;
      }

      .label {
        font-size: 28px;
      }

      .chevron {
        width: 24px;
        height: 24px;
        flex-basis: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="popup" role="dialog" aria-label="Capture options">
    <div class="top-row">
      <img
        class="mascot"
        src="file:///Users/dima/Desktop/%D0%9F%D0%B5%D1%80%D1%81%D0%BE%D0%BD%D0%B0%D0%B6/%D0%BF%D1%80%D0%B8%D0%B2%D0%B5%D1%82%D1%81%D1%82%D0%B2%D1%83%D0%B5%D1%82.png"
        alt=""
        aria-hidden="true"
      />
      <div class="chip">Full page</div>
    </div>

    <div class="actions">
      <button class="action-row" type="button" aria-label="Capture as PDF">
        <svg class="file-icon" viewBox="0 0 148 148" fill="none" aria-hidden="true">
          <path d="M41 18h43l28 27v75c0 6.6-5.4 12-12 12H41c-6.6 0-12-5.4-12-12V30c0-6.6 5.4-12 12-12Z" stroke="currentColor" stroke-width="5.5" stroke-linejoin="round"/>
          <path d="M84 18v19c0 4.4 3.6 8 8 8h20" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="71" y="92" text-anchor="middle" fill="currentColor" font-size="28" font-weight="700" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">PDF</text>
        </svg>

        <span class="label">Capture as PDF</span>

        <svg class="chevron" viewBox="0 0 54 54" fill="none" aria-hidden="true">
          <path d="M20 12L35 27L20 42" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="action-row" type="button" aria-label="Capture as PNG">
        <svg class="file-icon" viewBox="0 0 148 148" fill="none" aria-hidden="true">
          <path d="M41 18h43l28 27v75c0 6.6-5.4 12-12 12H41c-6.6 0-12-5.4-12-12V30c0-6.6 5.4-12 12-12Z" stroke="currentColor" stroke-width="5.5" stroke-linejoin="round"/>
          <path d="M84 18v19c0 4.4 3.6 8 8 8h20" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="71" y="92" text-anchor="middle" fill="currentColor" font-size="26" font-weight="700" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">PNG</text>
        </svg>

        <span class="label">Capture as PNG</span>

        <svg class="chevron" viewBox="0 0 54 54" fill="none" aria-hidden="true">
          <path d="M20 12L35 27L20 42" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</body>
</html>
