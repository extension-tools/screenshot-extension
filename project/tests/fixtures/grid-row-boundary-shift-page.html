<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Grid Row Boundary Shift Fixture</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #111827;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
    }

    header {
      height: 80px;
      padding: 24px 72px;
      background: #111827;
      color: #ffffff;
      font-size: 28px;
      font-weight: 800;
    }

    .intro {
      height: 650px;
      padding: 72px;
      background: linear-gradient(#f8fafc, #ffffff);
    }

    .intro h1 {
      margin: 0 0 20px;
      font-size: 52px;
    }

    .rack {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
      width: 1080px;
      margin: 0 auto 96px;
    }

    .unit {
      min-height: 330px;
      padding: 24px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      background: rgb(246, 240, 230);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);
    }

    .photo {
      height: 150px;
      margin-bottom: 22px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
    }

    .unit h2 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    .lower {
      height: 560px;
      margin: 0 72px 96px;
      border-radius: 10px;
      background: rgb(35, 120, 255);
    }
  </style>
</head>
<body>
  <header>Grid Row Boundary Shift</header>
  <main>
    <div class="intro">
      <h1>Boundary should move before the row</h1>
      <p>The first default viewport seam would cut into the row below.</p>
    </div>
    <div class="rack">
      <div class="unit"><div class="photo"></div><h2>Alpha block</h2><p>Same-height content block.</p></div>
      <div class="unit"><div class="photo"></div><h2>Beta block</h2><p>Same-height content block.</p></div>
      <div class="unit"><div class="photo"></div><h2>Gamma block</h2><p>Same-height content block.</p></div>
    </div>
    <div class="lower"></div>
  </main>
</body>
</html>
