<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huge Page Guard Fixture</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #122033;
      background: #ffffff;
    }

    header {
      position: sticky;
      top: 0;
      padding: 28px 48px;
      color: white;
      background: #1b3a6f;
    }

    main {
      min-height: 19000px;
      padding: 40px 48px;
      background:
        repeating-linear-gradient(
          to bottom,
          #ffffff 0,
          #ffffff 380px,
          #e8f0ff 380px,
          #e8f0ff 760px
        );
    }

    .marker {
      width: 100%;
      height: 280px;
      margin-bottom: 1200px;
      border: 8px solid #0057ff;
      background: #fff4b8;
    }
  </style>
</head>
<body>
  <header>
    <h1>Huge Page Guard Fixture</h1>
    <p>This page is intentionally taller than the MVP single-canvas limit.</p>
  </header>
  <main>
    <div class="marker">Top marker</div>
    <div class="marker">Middle marker</div>
    <div class="marker">Lower marker</div>
    <div class="marker">Bottom marker</div>
  </main>
</body>
</html>
