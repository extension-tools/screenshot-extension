<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Product Sticky Zone Fixture</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #111827;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
    }

    header {
      height: 72px;
      padding: 22px 64px;
      background: #111827;
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
    }

    .product {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 40px;
      max-width: 1180px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    .media-panel {
      position: sticky;
      top: 24px;
      align-self: start;
      min-height: 680px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid #dbe3ef;
      overflow: hidden;
    }

    .product-photo {
      height: 560px;
      margin: 40px;
      border-radius: 8px;
      background: rgb(11, 118, 255);
    }

    .media-caption {
      margin: 0 40px;
      font-size: 20px;
      font-weight: 700;
    }

    .buy-panel {
      min-height: 3200px;
    }

    .buy-panel h1 {
      margin: 0 0 18px;
      font-size: 34px;
    }

    .option-card {
      min-height: 270px;
      margin: 0 0 28px;
      padding: 28px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    .option-card:nth-child(4n) {
      background: #f8fafc;
    }

    .below {
      min-height: 1200px;
      padding: 96px 64px;
      background: #f3f4f6;
      font-size: 28px;
      font-weight: 800;
    }

    .floating-helper {
      position: absolute;
      right: 8px;
      top: 420px;
      z-index: 60;
      width: 56px;
      height: 56px;
      border-radius: 999px;
      background: rgb(255, 83, 180);
      box-shadow: 0 10px 24px rgba(17, 24, 39, 0.24);
    }
  </style>
</head>
<body>
  <header>Product Store</header>
  <main class="product">
    <section class="media-panel product-media-gallery">
      <div class="product-photo"></div>
      <p class="media-caption">Large sticky product media is real page content.</p>
    </section>
    <section class="buy-panel">
      <h1>Drone Pro Bundle</h1>
      <div class="option-card">Controller option</div>
      <div class="option-card">Battery option</div>
      <div class="option-card">Lens option</div>
      <div class="option-card">Storage option</div>
      <div class="option-card">Care plan</div>
      <div class="option-card">Charging hub</div>
      <div class="option-card">Travel bag</div>
      <div class="option-card">Propeller set</div>
      <div class="option-card">Accessory bundle</div>
      <div class="option-card">Warranty details</div>
    </section>
  </main>
  <section class="below">Normal page content continues after the product chooser.</section>
  <div class="floating-helper" role="button" aria-label="Customer support chat"></div>
</body>
</html>
