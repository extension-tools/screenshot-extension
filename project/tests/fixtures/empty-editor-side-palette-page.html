<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empty Editor Side Palette Fixture</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #e5e7eb;
      background: #16181c;
    }

    .app {
      display: grid;
      grid-template-rows: 88px 56px minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
    }

    .topbar,
    .toolbar {
      display: flex;
      align-items: center;
      padding: 0 28px;
      background: #202329;
      border-bottom: 1px solid #343840;
    }

    .topbar {
      font-size: 28px;
      font-weight: 700;
    }

    .workspace {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr) 280px;
      min-height: 0;
    }

    .shape-palette {
      min-height: 0;
      overflow-y: auto;
      padding: 18px;
      background: rgb(20, 90, 190);
      border-right: 1px solid #343840;
    }

    .shape {
      height: 82px;
      margin-bottom: 14px;
      border: 3px solid rgba(255, 255, 255, 0.85);
      border-radius: 8px;
    }

    .canvas-workspace {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      background: #17191d;
    }

    .empty-canvas {
      width: 2200px;
      height: 1800px;
      background:
        linear-gradient(#25282f 1px, transparent 1px),
        linear-gradient(90deg, #25282f 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .inspector {
      padding: 24px;
      background: #1d2026;
      border-left: 1px solid #343840;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">Untitled diagram</header>
    <nav class="toolbar">Toolbar</nav>
    <div class="workspace">
      <aside class="shape-palette" aria-label="Shape palette">
        <h2>Shapes</h2>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
      </aside>
      <main class="canvas-workspace" aria-label="Diagram canvas workspace">
        <div class="empty-canvas"></div>
      </main>
      <aside class="inspector" aria-label="Properties inspector">
        <h2>Style</h2>
        <p>Visible inspector panel.</p>
      </aside>
    </div>
  </div>
</body>
</html>
