<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Short Chat Internal Scroll Fixture</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #f8fafc;
      background: #050505;
    }

    .app {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
    }

    aside {
      padding: 24px;
      border-right: 1px solid #222;
      background: rgb(160, 40, 250);
    }

    .conversation {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: #050505;
    }

    .scroll-region {
      height: 100%;
      overflow-y: auto;
      padding: 80px 240px 180px;
    }

    .message {
      max-width: 760px;
      margin: 0 auto 36px;
      padding: 28px;
      border-radius: 18px;
      background: #151515;
      color: #f8fafc;
      font-size: 24px;
      line-height: 1.45;
    }

    .spacer {
      height: 680px;
    }

    .bottom-marker {
      max-width: 760px;
      min-height: 260px;
      margin: 0 auto;
      padding: 32px;
      border: 8px solid #f8fafc;
      border-radius: 20px;
      background: rgb(20, 220, 180);
      color: #03120f;
      font-size: 34px;
      font-weight: 700;
    }

    .composer {
      position: absolute;
      right: 220px;
      bottom: 24px;
      left: 220px;
      height: 76px;
      border-radius: 38px;
      background: #2a2a2a;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Chat-like app</h1>
      <p>The browser window itself does not scroll.</p>
    </aside>
    <main class="conversation">
      <div class="scroll-region">
        <article class="message">
          This fixture has only a short internal scroll range. It should still be treated as the capture target.
        </article>
        <div class="spacer"></div>
        <article class="bottom-marker">
          Short chat bottom marker
        </article>
      </div>
      <div class="composer"></div>
    </main>
  </div>
</body>
</html>
